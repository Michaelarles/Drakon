# Plan B local: levanta la misma aplicación con su propio PostgreSQL.
#   docker compose up --build      →  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: drakon
      POSTGRES_USER: drakon
      POSTGRES_PASSWORD: drakon
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drakon"]
      interval: 3s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://drakon:drakon@db:5432/drakon
      SECRET_KEY: clave-local-no-usar-en-produccion
      DEBUG: "true"
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: Admin-2026!
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
