{% extends "drakon/base.html" %}{% load static %}
{% block titulo %}Ingresar{% endblock %}
{% block publico %}
<main class="login">
  <div class="tarjeta">
    <img class="drakon" src="{% static 'drakon/avatar/bienvenida.png' %}" alt="">
    <img src="{% static 'drakon/avatar/logo_completo.png' %}" alt="DRAKON" style="height:38px" class="d-block mx-auto mt-2">
    <p class="text-muted small mt-2 mb-4">Sistema de gestión de auditorías de sistemas de información</p>
    {% if form.errors %}<div class="alert alert-danger py-2 text-start"><img src="{% static 'drakon/avatar/error.png' %}" alt=""><div>Usuario o contraseña incorrectos.</div></div>{% endif %}
    <form method="post" class="text-start">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label requerido" for="id_username">Usuario</label>
        <input class="form-control" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
      </div>
      <div class="mb-4">
        <label class="form-label requerido" for="id_password">Contraseña</label>
        <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</main>
{% endblock %}
